name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ai,mcp,otel]"

      - name: Ruff lint
        run: ruff check sentinel tests

      - name: Ruff format check
        run: ruff format --check sentinel tests

      - name: Mypy
        run: mypy sentinel
        continue-on-error: true  # relax to warning until Phase 2 is typed

      - name: Pytest
        run: pytest -m "not integration and not eval" --cov=sentinel --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
