[project]
name = "argus-agent"
version = "0.1.0"
description = "Product-agnostic AI monitoring, investigation, and remediation agent. Pluggable per product; Saboten ships as the reference plugin."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40.0"]
mcp = ["mcp[cli]>=1.2.0"]
metrics = ["prometheus-client>=0.20.0"]
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]
integration = ["testcontainers[redis]>=4.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["argus*", "products*"]

[project.entry-points."argus.plugins"]
saboten = "products.saboten:register"
example = "products.example:register"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests that need Redis/Docker",
    "eval: eval-harness runs (slow, costs tokens)",
]
addopts = "-ra --strict-markers"
