# Argus — primary configuration.
#
# Minimal template. Point at a plugin's reference config for a real
# starting point (e.g. products/saboten/config/saboten.example.yaml).
#
#   product: saboten          # loads only the Saboten plugin
#   products: [saboten, aws]  # loads several
#   (omit both to load every discovered plugin)

environments:
  dev:
    services: {}
      # Core check types that need no plugin:
      #
      # example-api:
      #   host: "localhost"
      #   checks:
      #     - type: http
      #       path: "/health"
      #       port: 8080
      #       interval: 60
      #     - type: tcp
      #       port: 5432               # plain port-open check
      #       interval: 30
      #     - type: prometheus_scrape
      #       port: 9090
      #       path: "/metrics"
      #       interval: 60
      #       thresholds:
      #         metric: "http_request_errors_total"
      #         labels: {code: "500"}  # optional series matcher
      #         warning: 10
      #         critical: 50

alerting:
  teams:
    enabled: false
  slack:
    enabled: false
    channel: "#argus-alerts"
  email:
    enabled: false

  routing:
    - severity: critical
      channels: [teams, slack]
    - severity: warning
      channels: [teams]

  dedup:
    cooldown_minutes: 30

# Prometheus /metrics endpoint. The server runs in a background thread
# and is a no-op if the `metrics` extra isn't installed.
metrics:
  enabled: true
  port: 9090
  addr: "0.0.0.0"
